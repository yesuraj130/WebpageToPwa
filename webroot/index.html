<!DOCTYPE html>
<html lang="en">
<head>
<title>HJM Mixer</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json" crossorigin="use-credentials">

<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #000;
  }
  body {
    display: grid;
    grid-template-rows: 100vh;
    grid-template-columns: 100vw;
  }
  #mixerFrame {
    width: 100vw;
    height: 100vh;
    border: none;
    margin: 0;
    padding: 0;
    display: block;
    grid-row: 1;
    grid-column: 1;
  }
</style>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' });
  });
}

let currentScale = 1;
function openFullscreen(){
   if (!document.fullscreenElement)
   {
      var elem = document.documentElement;
      if (elem.requestFullscreen)
      {
          elem.requestFullscreen().catch(() => {});
          if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(() => {});
          }
      }
   }
   else
   {
      if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
      }
   }
}

function decreaseScale(){
    var elem = document.documentElement;
	currentScale = currentScale - 0.1;
	elem.style.scale = currentScale;
}

function increaseScale(){
    var elem = document.documentElement;
	currentScale = currentScale + 0.1;
	elem.style.scale = currentScale;	
}

//function lockLandscape()
//{
//    var elem = document.documentElement;
//    if (elem.requestFullscreen)
//    {
//       elem.requestFullscreen();
//    }
//    screen.orientation.lock('landscape');
//    document.getElementById('rotateButton').style.display = 'none';
//}

const LOCAL_MIXER_URL = "http://192.168.0.120/mixer.html";
const DEMO_MIXER_URL = "https://www.soundcraft.com/ui24-software-demo/mixer.html";

function setMixerSource(url) {
  const frame = document.getElementById('mixerFrame');
  if (frame && frame.getAttribute('src') !== url) {
    frame.src = url;
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const isHttps = window.location.protocol === 'https:';

  // If forced via ?demo or ?local
  if (params.has('demo')) {
    setMixerSource(DEMO_MIXER_URL);
    return;
  }
  if (params.has('local')) {
    setMixerSource(LOCAL_MIXER_URL);
    return;
  }

  // When on HTTPS (like AI Studio cloud preview), browsers block http:// mixed content.
  // Immediately use demo URL so you can test anywhere.
  if (isHttps) {
    setMixerSource(DEMO_MIXER_URL);
    return;
  }

  // When on HTTP (local IIS), try local mixer first.
  setMixerSource(LOCAL_MIXER_URL);

  // If local mixer cannot be reached within 2.5s, fall back to demo
  const controller = new AbortController();
  const timeoutId = setTimeout(() => {
    controller.abort();
    setMixerSource(DEMO_MIXER_URL);
  }, 2500);

  fetch(LOCAL_MIXER_URL, { mode: 'no-cors', signal: controller.signal })
    .then(() => clearTimeout(timeoutId))
    .catch(() => {
      clearTimeout(timeoutId);
      setMixerSource(DEMO_MIXER_URL);
    });
});
</script>
</head>
<body style="border:none; margin:0; display: grid; background-color: #000; ">
  <iframe id="mixerFrame" src="http://192.168.0.120/mixer.html" style="height:100%; width:100%; border:none; margin:0; grid-row:1; grid-column:1; "></iframe>
<div style="grid-row:1; grid-column:1; height:30px; width:85px; margin-left: auto; margin-right: 20%; margin-top:7px; display:flex; gap:4px; align-items:center; z-index:10; ">
