<!DOCTYPE html>
<html lang="en" style="width:100%; height:100%; margin:0; padding:0; overflow:hidden; background-color:#000;">
<head>
<title>HJM Mixer</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json" crossorigin="use-credentials">
<link rel="icon" type="image/svg+xml" href="./icon.svg">

<script>

if ('serviceWorker' in navigator) 
{
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', { scope: './' }); });
}

function openFullscreen()
{
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.({ navigationUI: "hide" }).catch(() => {});
  else document.exitFullscreen?.().catch(() => {});
  
}

// Attempt fullscreen on load
window.addEventListener('load', () => { openFullscreen(); });
document.addEventListener('DOMContentLoaded', () => { openFullscreen(); });

const LOCAL_MIXER_URL = "http://192.168.0.120/mixer.html";
const DEMO_MIXER_URL = "https://www.soundcraft.com/ui24-software-demo/mixer.html";

function setMixerSource(url)
{
  const frame = document.getElementById('mixerFrame');
  if (frame && frame.getAttribute('src') !== url) frame.src = url;
}

window.addEventListener('DOMContentLoaded', () => 
{
  if (window.location.protocol === 'https:') setMixerSource(DEMO_MIXER_URL);
  else setMixerSource(LOCAL_MIXER_URL);
});

</script>
</head>
<body style="width:100%; height:100%; margin:0; padding:0; overflow:hidden; background-color:#000; display:grid; border:none;">
  <iframe id="mixerFrame" style="width:100%; height:100%; border:none; margin:0; padding:0; display:block; grid-row:1; grid-column:1;"></iframe>
  <div style="grid-row:1; grid-column:1; height:30px; margin-left:auto; margin-right:20%; margin-top:7px; display:flex; align-items:center; z-index:10;">
    <button title="Full screen" style="height:24px; width:24px; padding:0; cursor:pointer;" onclick="openFullscreen()">
      <svg style="margin:0; padding:0; width:100%; height:100%;" viewBox="0 0 24 24">
        <path style="margin:0; padding:0;" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
    </button>
  </div>
</body>
</html>
