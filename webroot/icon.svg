<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="url(#bg)" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- Channel 1 Track & Fader -->
  <line x1="160" y1="128" x2="160" y2="384" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <!-- Meter LEDs -->
