  <line x1="328" y1="270" x2="340" y2="270" stroke="#22c55e" stroke-width="4"/>
  <line x1="328" y1="240" x2="340" y2="240" stroke="#22c55e" stroke-width="4"/>
  <line x1="328" y1="210" x2="340" y2="210" stroke="#22c55e" stroke-width="4"/>
  <line x1="328" y1="180" x2="340" y2="180" stroke="#eab308" stroke-width="4"/>
  <!-- Knob -->
  <rect x="322" y="170" width="60" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <line x1="322" y1="186" x2="382" y2="186" stroke="#38bdf8" stroke-width="3"/>

  <!-- App Title Label -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">HJM MIXER</text>
