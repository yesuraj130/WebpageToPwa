  <!-- Meter LEDs -->
  <line x1="232" y1="360" x2="244" y2="360" stroke="#22c55e" stroke-width="4"/>
  <line x1="232" y1="330" x2="244" y2="330" stroke="#22c55e" stroke-width="4"/>
  <!-- Knob -->
  <rect x="226" y="310" width="60" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <line x1="226" y1="326" x2="286" y2="326" stroke="#38bdf8" stroke-width="3"/>

  <!-- Channel 3 Track & Fader -->
  <line x1="352" y1="128" x2="352" y2="384" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <!-- Meter LEDs -->
  <line x1="328" y1="360" x2="340" y2="360" stroke="#22c55e" stroke-width="4"/>
  <line x1="328" y1="330" x2="340" y2="330" stroke="#22c55e" stroke-width="4"/>
