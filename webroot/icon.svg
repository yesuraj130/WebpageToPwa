  <line x1="136" y1="240" x2="148" y2="240" stroke="#eab308" stroke-width="4"/>
  <line x1="136" y1="210" x2="148" y2="210" stroke="#ef4444" stroke-width="4"/>
  <!-- Knob -->
  <rect x="130" y="240" width="60" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <line x1="130" y1="256" x2="190" y2="256" stroke="#38bdf8" stroke-width="3"/>

